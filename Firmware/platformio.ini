; H.I.R.O MDS-0027 — firmware build config
; Target: Seeed XIAO ESP32-S3 (Plus). Build/upload with the PlatformIO IDE extension in VS Code.

[env:hiro]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; XIAO ESP32-S3 has OPI PSRAM (8 MB) + 16 MB flash — the audio codecs lean on PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = huge_app.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1          ; Serial over native USB
  -DLGFX_USE_V1

lib_deps =
  lovyan03/LovyanGFX @ ^1.2.0          ; ST7789 display + sprites
  https://github.com/schreibfaul1/ESP32-audioI2S.git   ; MP3/AAC/FLAC/WAV/OGG/Opus decode -> I2S
